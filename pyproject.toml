[project]
name = "smart-punching-bag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
    "pytorch-triton-rocm ; sys_platform == 'linux'",
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-chroma>=1.1.0",
    "pymupdf>=1.27.2.3",
    "pymupdf-layout>=1.27.2.3",
    "pymupdf4llm>=0.2.7",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "tqdm>=4.66.5",
    "pix2tex>=0.1.4",
    "fastapi[standard]>=0.136.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
